name: NeoTract
description: 'NeoTract was a privately-held medical device company founded in 2004 that developed and
  commercialized the FDA-cleared UroLift System, a minimally invasive transurethral treatment for lower
  urinary tract symptoms caused by benign prostatic hyperplasia (BPH). Teleflex Incorporated acquired
  NeoTract for up to $1.1 billion in October 2017; the UroLift product line now lives under Teleflex at
  urolift.com. Surfaced as a portfolio company of NEA. This is a physical medical-device business with no
  public developer, API, or SDK surface; the neotract.com domain no longer resolves.'
